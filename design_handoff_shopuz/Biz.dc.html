<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="chic.css">
</helmet>
<div style="background:var(--bg);min-width:0;min-height:100%">
  <dc-import name="StoreNav" active="" cart-count="2" hint-size="100%,84px"></dc-import>

  <div style="max-width:720px;margin:0 auto;padding:52px 30px 20px;text-align:center">
    <span class="kicker">{{ kicker }}</span>
    <h1 style="font-size:clamp(32px,4.6vw,52px);margin-top:12px">Shop Uz Feruzaxon</h1>
    <p style="font-size:16px;color:var(--ink-2);line-height:1.85;margin-top:18px">{{ body }}</p>
  </div>

  <div style="max-width:820px;margin:0 auto;padding:24px 30px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px">
      <div style="border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center">
        <div style="font-family:var(--serif);font-weight:600;font-size:42px;color:var(--accent-deep);line-height:1">2016</div>
        <div class="muted" style="font-size:13px;margin-top:8px">{{ statYear }}</div>
      </div>
      <div style="border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center">
        <div style="font-family:var(--serif);font-weight:600;font-size:42px;color:var(--accent-deep);line-height:1">25K+</div>
        <div class="muted" style="font-size:13px;margin-top:8px">{{ statClients }}</div>
      </div>
      <div style="border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center">
        <div style="font-family:var(--serif);font-weight:600;font-size:42px;color:var(--accent-deep);line-height:1">TR</div>
        <div class="muted" style="font-size:13px;margin-top:8px">{{ statTurkey }}</div>
      </div>
    </div>

    <div style="margin-top:22px;border-radius:var(--r);background:var(--bg-2);padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px">
      <h3 style="font-size:20px">{{ ctaHead }}</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <a href="https://t.me/ShopuzFeruzaxon" target="_blank" rel="noopener" class="btn btn-primary" style="gap:8px"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M228 44 26 122c-11 4-11 19 0 23l52 18 18 55c3 10 16 12 23 3l26-31 45 33c8 6 20 2 22-8l30-160c3-12-9-22-20-16Z"/></svg>Telegram</a>
        <a href="https://www.instagram.com/shopuzferuzaxon1" target="_blank" rel="noopener" class="btn btn-secondary" style="gap:8px"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><rect x="40" y="40" width="176" height="176" rx="48"/><circle cx="128" cy="128" r="40"/><circle cx="176" cy="80" r="12" fill="currentColor" stroke="none"/></svg>Instagram</a>
      </div>
    </div>
  </div>

  <dc-import name="StoreFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  lang() { try { return localStorage.getItem("suf_lang") || "uz"; } catch (e) { return "uz"; } }
  componentDidMount() { this._lh = () => this.forceUpdate(); window.addEventListener("suf-lang", this._lh); }
  componentWillUnmount() { window.removeEventListener("suf-lang", this._lh); }
  renderVals() {
    const R = this.lang() === "ru";
    return {
      kicker: R ? "О нас" : "Biz haqimizda",
      body: R
        ? "Мы открылись в 2016 году. Принимаем онлайн-заказы в Telegram и Instagram, привозим товары из Турции и продолжаем радовать наших клиентов."
        : "2016-yilda ochildik. Telegram va Instagramda onlayn zakazlar qabul qilib, Turkiyadan mahsulotlar olib kelib sotamiz va mijozlarni xursand qilishda davom etmoqdamiz.",
      statYear: R ? "Год открытия" : "Ochilgan yil",
      statClients: R ? "Подписчиков в Telegram и Instagram" : "Telegram va Instagram obunachilari",
      statTurkey: R ? "Товары из Турции" : "Turkiya mahsulotlari",
      ctaHead: R ? "Мы в социальных сетях" : "Ijtimoiy tarmoqlarda bizni kuzating",
    };
  }
}
</script>
</body>
</html>
