<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="chic.css">
</helmet>
<div style="background:var(--bg);min-width:0;min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="StoreNav" active="" cart-count="2" hint-size="100%,84px"></dc-import>

  <div style="flex:1;display:grid;place-items:center;padding:60px 30px">
    <div style="max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px">
      <span style="display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--accent-100);color:var(--accent)"><svg width="34" height="34" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="round"><rect x="40" y="112" width="176" height="104" rx="12"/><path d="M84 112V80a44 44 0 0 1 88 0v32"/><circle cx="128" cy="160" r="14"/></svg></span>
      <span class="kicker">{{ kicker }}</span>
      <h1 style="font-size:clamp(30px,4.6vw,46px)">{{ title }}</h1>
      <p style="font-size:15px;color:var(--ink-2);line-height:1.7">{{ body }}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px">
        <span class="tag tag-outline">{{ t1 }}</span>
        <span class="tag tag-outline">{{ t2 }}</span>
        <span class="tag tag-outline">{{ t3 }}</span>
        <span class="tag tag-outline">{{ t4 }}</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px">
        <a href="Home.dc.html" class="btn btn-primary">{{ backBtn }}</a>
        <button onClick="{{ logout }}" class="btn btn-secondary">{{ logoutBtn }}</button>
      </div>
    </div>
  </div>

  <dc-import name="StoreFooter" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  lang() { try { return localStorage.getItem("suf_lang") || "uz"; } catch (e) { return "uz"; } }
  componentDidMount() {
    this._lh = () => this.forceUpdate();
    window.addEventListener("suf-lang", this._lh);
    try { localStorage.setItem("suf_admin", "1"); } catch (e) {}
  }
  componentWillUnmount() { window.removeEventListener("suf-lang", this._lh); }
  renderVals() {
    const R = this.lang() === "ru";
    return {
      kicker: R ? "Только для персонала" : "Faqat xodimlar uchun",
      title: R ? "Админ-панель" : "Admin panel",
      body: R
        ? "Раздел управления магазином. Содержимое определим позже — сюда добавим товары, заказы и статистику."
        : "Do'konni boshqarish bo'limi. Bu yerga nimalar bo'lishini keyinroq belgilaymiz — mahsulotlar, buyurtmalar va statistika qo'shiladi.",
      t1: R ? "Товары" : "Mahsulotlar",
      t2: R ? "Заказы" : "Buyurtmalar",
      t3: R ? "Статистика" : "Statistika",
      t4: R ? "Скидки" : "Chegirmalar",
      backBtn: R ? "На главную" : "Bosh sahifaga",
      logoutBtn: R ? "Выйти из админ-режима" : "Admin rejimidan chiqish",
      logout: () => { try { localStorage.removeItem("suf_admin"); } catch (e) {} window.location.href = "Home.dc.html"; },
    };
  }
}
</script>
</body>
</html>
