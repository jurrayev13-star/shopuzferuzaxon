<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="chic.css">
<script src="./image-slot.js"></script>
</helmet>
<article style="display:flex;flex-direction:column;min-width:0">
  <div style="position:relative;aspect-ratio:{{ aspect }};background:var(--tile);overflow:hidden">
    <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ false }}">
      <img src="{{ img }}" alt="{{ title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    </sc-if>
    <sc-if value="{{ noImg }}" hint-placeholder-val="{{ true }}">
      <image-slot id="{{ slotId }}" shape="rect" fit="cover" placeholder="Mahsulot rasmi"></image-slot>
    </sc-if>
    <div style="position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none">
      <sc-for list="{{ tags }}" as="t" hint-placeholder-count="1">
        <span class="tag tag-{{ t.type }}">{{ t.label }}</span>
      </sc-for>
    </div>
    <div style="position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px">
      <button class="btn-icon" aria-label="Sevimliga" style="width:34px;height:34px;background:#fff;box-shadow:var(--sh-sm)">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18"><path d="M128 216S28 160 28 92a52 52 0 0 1 100-20 52 52 0 0 1 100 20c0 68-100 124-100 124Z"/></svg>
      </button>
    </div>
  </div>
  <div style="padding:16px 2px 4px;display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center;min-width:0">
    <div style="font-family:var(--sans);font-weight:400;font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">{{ title }}</div>
    <sc-if value="{{ sizeLabel }}" hint-placeholder-val="{{ false }}">
      <div class="muted" style="font-size:11.5px;letter-spacing:.04em">{{ sizeLabel }}</div>
    </sc-if>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-family:var(--sans);font-weight:500;font-size:15px;color:{{ priceColor }}">{{ price }}</span>
      <sc-if value="{{ oldPrice }}" hint-placeholder-val="{{ true }}">
        <span class="muted" style="text-decoration:line-through;font-size:13px">{{ oldPrice }}</span>
      </sc-if>
    </div>
    <sc-if value="{{ decant }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:11px;color:var(--accent);background:var(--accent-100);padding:3px 9px;border-radius:999px">{{ decant }}</div>
    </sc-if>
    <div class="stars">
      <sc-for list="{{ starList }}" as="s" hint-placeholder-count="5">
        <span class="{{ s.cls }}">★</span>
      </sc-for>
    </div>
    <sc-if value="{{ hasColors }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:6px;margin-top:2px">
        <sc-for list="{{ colorDots }}" as="c" hint-placeholder-count="3">
          <span style="width:12px;height:12px;border-radius:50%;background:{{ c }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)"></span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasSizes }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px">
        <sc-for list="{{ sizeChips }}" as="s" hint-placeholder-count="2">
          <span onClick="{{ s.pick }}" style="min-width:34px;text-align:center;padding:6px 10px;font-size:12px;cursor:pointer;border:1px solid {{ s.border }};background:{{ s.bg }};color:{{ s.color }}">{{ s.label }}</span>
        </sc-for>
      </div>
    </sc-if>
    <button onClick="{{ addToCart }}" class="btn btn-primary" style="width:100%;margin-top:8px;padding:11px;font-size:12.5px;gap:7px;border:none;cursor:pointer">
      <svg width="15" height="15" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"><path d="M56 72h144l-11 128a16 16 0 0 1-16 15H83a16 16 0 0 1-16-15Z"/><path d="M88 96V72a40 40 0 0 1 80 0v24"/></svg>
      {{ addLabel }}
    </button>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:380},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pc-1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Miss Dior Blooming Bouquet&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sizeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100 ml&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;370 000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;oldPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;decant&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:5},&quot;tags&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,type:string}[]&quot;},&quot;colorDots&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  state = { sel: 0, added: false };
  lang() { try { return localStorage.getItem("suf_lang") || "uz"; } catch (e) { return "uz"; } }
  readCart() { try { return JSON.parse(localStorage.getItem("suf_cart") || "[]"); } catch (e) { return []; } }
  writeCart(c) { try { localStorage.setItem("suf_cart", JSON.stringify(c)); } catch (e) {} window.dispatchEvent(new CustomEvent("suf-cart")); }
  addToCart() {
    const p = this.props;
    const size = (p.sizes && p.sizes.length) ? p.sizes[this.state.sel] : null;
    const key = (p.slotId || p.title) + "|" + (size || "");
    const price = parseInt(String(p.price || "0").replace(/[^0-9]/g, ""), 10) || 0;
    const cart = this.readCart();
    const ex = cart.find((x) => x.key === key);
    if (ex) ex.qty++;
    else cart.push({ key, title: p.title, img: p.img || "", price, size: size || "", sub: p.sizeLabel || "", qty: 1 });
    this.writeCart(cart);
    this.setState({ added: true });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ added: false }), 1300);
  }
  componentDidMount() { this._lh = () => this.forceUpdate(); window.addEventListener("suf-lang", this._lh); }
  componentWillUnmount() { window.removeEventListener("suf-lang", this._lh); }
  renderVals() {
    const p = this.props;
    const R = this.lang() === "ru";
    const cur = R ? " сум" : " so'm";
    const rating = p.rating ?? 4;
    const onSale = !!p.oldPrice;
    const starList = Array.from({ length: 5 }, (_, i) => ({ cls: i < rating ? "on" : "off" }));
    const colorDots = p.colorDots ?? [];
    const sizes = p.sizes ?? [];
    const aspect = p.tall ? "9 / 16" : "1";
    return {
      slotId: p.slotId ?? "pc-" + Math.random().toString(36).slice(2, 8),
      img: p.img || null,
      hasImg: !!(p.img && p.img.length),
      noImg: !(p.img && p.img.length),
      title: p.title ?? "Mahsulot nomi",
      aspect,
      sizeLabel: p.sizeLabel ?? null,
      decant: p.decant ?? null,
      price: (p.price ?? "199 000") + cur,
      oldPrice: p.oldPrice ? p.oldPrice + cur : null,
      priceColor: onSale ? "var(--sale)" : "var(--ink)",
      tags: p.tags ?? [],
      colorDots,
      hasColors: colorDots.length > 0,
      addLabel: this.state.added ? (R ? "Добавлено ✓" : "Qo'shildi ✓") : (R ? "В корзину" : "Savatga qo'shish"),
      addToCart: () => this.addToCart(),
      hasSizes: sizes.length > 0,
      sizeChips: sizes.map((label, i) => {
        const on = i === this.state.sel;
        return { label, pick: () => this.setState({ sel: i }), border: on ? "var(--ink)" : "var(--line-2)", bg: on ? "var(--ink)" : "var(--surface)", color: on ? "#fff" : "var(--ink-2)" };
      }),
      starList,
    };
  }
}
</script>
</body>
</html>
