<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="chic.css">
</helmet>
<div style="background:var(--bg);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)">
  <nav style="display:grid;grid-template-columns:{{ navCols }};align-items:center;gap:{{ navGap }};padding:{{ navPad }};max-width:1280px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:20px;min-width:0;flex-wrap:nowrap;white-space:nowrap">
      <button onClick="{{ openMenu }}" class="btn-icon" aria-label="Menyu" style="width:26px;height:26px">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"><line x1="40" y1="80" x2="216" y2="80"/><line x1="40" y1="128" x2="216" y2="128"/><line x1="40" y1="176" x2="216" y2="176"/></svg>
      </button>
      <div style="display:{{ deskCluster }};align-items:center;gap:20px;font-size:14px;flex-wrap:nowrap;white-space:nowrap">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="1">
          <a href="{{ l.href }}" style="position:relative;color:{{ l.color }};padding:6px 0;letter-spacing:.01em">{{ l.label }}<sc-if value="{{ l.badge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-8px;right:-24px;background:var(--sale);color:#fff;font-size:8px;font-weight:600;letter-spacing:.08em;padding:2px 5px;border-radius:3px">{{ newLabel }}</span></sc-if><span style="position:absolute;left:0;bottom:0;height:1.5px;background:var(--ink);width:{{ l.uw }}"></span></a>
        </sc-for>
        <a href="{{ tgHref }}" target="_blank" rel="noopener" aria-label="Telegram" style="display:flex;align-items:center;color:var(--ink-2)">
          <svg width="26" height="26" viewBox="0 0 256 256" fill="#229ED9"><path d="M228 44 26 122c-11 4-11 19 0 23l52 18 18 55c3 10 16 12 23 3l26-31 45 33c8 6 20 2 22-8l30-160c3-12-9-22-20-16Z"/></svg>
        </a>
        <a href="{{ igHref }}" target="_blank" rel="noopener" aria-label="Instagram" style="display:flex;align-items:center;color:var(--ink-2)">
          <svg width="26" height="26" viewBox="0 0 256 256" fill="none" stroke="#E1306C" stroke-width="16"><rect x="40" y="40" width="176" height="176" rx="48"/><circle cx="128" cy="128" r="40"/><circle cx="176" cy="80" r="12" fill="#E1306C" stroke="none"/></svg>
        </a>
      </div>
    </div>

    <a href="Home.dc.html" style="display:flex;align-items:center;justify-content:{{ logoJustify }};gap:11px;line-height:1;min-width:0">
      <img src="assets/feruzaxon-logo.jpg" alt="Shop Uz Feruzaxon" style="width:{{ logoImg }};height:{{ logoImg }};border-radius:50%;object-fit:cover;flex:none">
      <span style="font-family:var(--serif);font-weight:600;font-size:{{ logoFont }};letter-spacing:.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Shop Uz Feruzaxon</span>
    </a>

    <div style="display:flex;align-items:center;justify-content:flex-end">
      <div style="display:{{ deskRight }};align-items:center;gap:18px">
      <a href="{{ authHref }}" style="font-size:13px;color:var(--ink-2);white-space:nowrap;letter-spacing:.01em">{{ loginLabel }}</a>
      <button class="btn-icon" aria-label="Qidirish" style="width:22px;height:22px">
        <svg width="19" height="19" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"><circle cx="116" cy="116" r="84"/><line x1="175" y1="175" x2="226" y2="226"/></svg>
      </button>
      <a href="Cart.dc.html" class="btn-icon" aria-label="Savat" style="width:22px;height:22px;position:relative">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"><path d="M56 72h144l-11 128a16 16 0 0 1-16 15H83a16 16 0 0 1-16-15Z"/><path d="M88 96V72a40 40 0 0 1 80 0v24"/></svg>
        <span style="position:absolute;top:-7px;right:-9px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:500">{{ cartCount }}</span>
      </a>
      <button class="btn-icon" aria-label="Sevimlilar" style="width:22px;height:22px">
        <svg width="19" height="19" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M128 216S28 160 28 92a52 52 0 0 1 100-20 52 52 0 0 1 100 20c0 68-100 124-100 124Z"/></svg>
      </button>
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.04em;user-select:none">
        <span onClick="{{ setUz }}" style="display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:{{ uzW }};color:{{ uzC }}"><svg width="18" height="12" viewBox="0 0 30 20" style="border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"><rect width="30" height="20" fill="#fff"/><rect width="30" height="6" y="0" fill="#0099B5"/><rect width="30" height="6" y="14" fill="#1EB53A"/><rect width="30" height="1" y="6" fill="#CE1126"/><rect width="30" height="1" y="13" fill="#CE1126"/><circle cx="6" cy="3.2" r="2" fill="#fff"/><circle cx="7" cy="3.2" r="2" fill="#0099B5"/></svg>UZ</span>
        <span style="color:var(--line-2)">|</span>
        <span onClick="{{ setRu }}" style="display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:{{ ruW }};color:{{ ruC }}"><svg width="18" height="12" viewBox="0 0 30 20" style="border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"><rect width="30" height="20" fill="#fff"/><rect width="30" height="6.67" y="6.67" fill="#0039A6"/><rect width="30" height="6.66" y="13.34" fill="#D52B1E"/></svg>RU</span>
      </div>
      </div>
      <div style="display:{{ mobRight }};align-items:center;gap:16px">
        <button class="btn-icon" aria-label="Qidirish" style="width:24px;height:24px">
          <svg width="21" height="21" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"><circle cx="116" cy="116" r="84"/><line x1="175" y1="175" x2="226" y2="226"/></svg>
        </button>
        <a href="{{ authHref }}" class="btn-icon" aria-label="Kirish" style="width:24px;height:24px">
          <svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><circle cx="128" cy="96" r="52"/><path d="M32 210c14-34 50-58 96-58s82 24 96 58"/></svg>
        </a>
        <a href="Cart.dc.html" class="btn-icon" aria-label="Savat" style="width:24px;height:24px;position:relative">
          <svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"><path d="M56 72h144l-11 128a16 16 0 0 1-16 15H83a16 16 0 0 1-16-15Z"/><path d="M88 96V72a40 40 0 0 1 80 0v24"/></svg>
          <span style="position:absolute;top:-7px;right:-9px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:500">{{ cartCount }}</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- DRAWER -->
  <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:90;background:rgba(20,15,12,.45);opacity:{{ ovOp }};pointer-events:{{ ovPe }};transition:opacity .3s ease"></div>
  <aside style="position:fixed;top:0;left:0;bottom:0;z-index:91;width:min(360px,88vw);background:var(--bg);box-shadow:var(--sh);transform:translateX({{ panelX }});transition:transform .32s ease;display:flex;flex-direction:column;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line)">
      <span style="font-family:var(--serif);font-weight:600;font-size:21px">Shop Uz Feruzaxon</span>
      <button onClick="{{ closeMenu }}" class="btn-icon" aria-label="Yopish" style="width:30px;height:30px"><svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round"><line x1="200" y1="56" x2="56" y2="200"/><line x1="200" y1="200" x2="56" y2="56"/></svg></button>
    </div>

    <div style="padding:22px 24px;display:flex;flex-direction:column;gap:8px">
      <div style="font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px">{{ catTitle }}</div>
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="7">
        <a href="{{ c.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--line)">{{ c.label }}<svg width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="var(--ink-soft)" stroke-width="18" stroke-linecap="round"><polyline points="96 48 176 128 96 208"/></svg></a>
      </sc-for>
    </div>

    <div style="padding:6px 24px 22px;display:flex;flex-direction:column;gap:2px">
      <a href="Chegirma.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;font-size:15px;color:var(--ink)"><svg width="19" height="19" viewBox="0 0 256 256" fill="none" stroke="var(--sale)" stroke-width="16" stroke-linecap="round"><path d="M128 24l24 40 46 8-32 34 6 46-44-20-44 20 6-46-32-34 46-8Z"/></svg>{{ discountLabel }}</a>
      <a href="Aloqa.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;font-size:15px;color:var(--ink)"><svg width="19" height="19" viewBox="0 0 256 256" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linejoin="round"><path d="M128 24a80 80 0 0 0-80 80c0 68 80 128 80 128s80-60 80-128a80 80 0 0 0-80-80Z"/><circle cx="128" cy="104" r="28"/></svg>{{ addressLabel }}</a>
      <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
        <a href="Admin.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;font-size:15px;color:var(--ink)"><svg width="19" height="19" viewBox="0 0 256 256" fill="none" stroke="var(--ink-2)" stroke-width="16" stroke-linejoin="round"><circle cx="128" cy="96" r="44"/><path d="M32 208a104 104 0 0 1 192 0"/></svg>{{ adminPanel }}</a>
      </sc-if>
    </div>

    <div style="margin-top:auto;padding:20px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px">
        <span onClick="{{ setUz }}" style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:{{ uzW }};color:{{ uzC }}"><svg width="20" height="13" viewBox="0 0 30 20" style="border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"><rect width="30" height="20" fill="#fff"/><rect width="30" height="6" y="0" fill="#0099B5"/><rect width="30" height="6" y="14" fill="#1EB53A"/><rect width="30" height="1" y="6" fill="#CE1126"/><rect width="30" height="1" y="13" fill="#CE1126"/><circle cx="6" cy="3.2" r="2" fill="#fff"/><circle cx="7" cy="3.2" r="2" fill="#0099B5"/></svg>UZ</span>
        <span style="color:var(--line-2)">|</span>
        <span onClick="{{ setRu }}" style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:{{ ruW }};color:{{ ruC }}"><svg width="20" height="13" viewBox="0 0 30 20" style="border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"><rect width="30" height="20" fill="#fff"/><rect width="30" height="6.67" y="6.67" fill="#0039A6"/><rect width="30" height="6.66" y="13.34" fill="#D52B1E"/></svg>RU</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <a href="{{ tgHref }}" target="_blank" rel="noopener" aria-label="Telegram" style="display:flex"><svg width="22" height="22" viewBox="0 0 256 256" fill="#229ED9"><path d="M228 44 26 122c-11 4-11 19 0 23l52 18 18 55c3 10 16 12 23 3l26-31 45 33c8 6 20 2 22-8l30-160c3-12-9-22-20-16Z"/></svg></a>
        <a href="{{ igHref }}" target="_blank" rel="noopener" aria-label="Instagram" style="display:flex"><svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="#E1306C" stroke-width="16"><rect x="40" y="40" width="176" height="176" rx="48"/><circle cx="128" cy="128" r="40"/><circle cx="176" cy="80" r="12" fill="#E1306C" stroke="none"/></svg></a>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Bosh sahifa&quot;,&quot;options&quot;:[&quot;Bosh sahifa&quot;,&quot;Do'kon&quot;,&quot;Sahifalar&quot;,&quot;Kolleksiya&quot;,&quot;Blog&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { open: false, mobile: (typeof window !== "undefined" && window.innerWidth <= 820) };
  lang() { try { return localStorage.getItem("suf_lang") || "uz"; } catch (e) { return "uz"; } }
  componentDidMount() {
    this._lh = () => this.forceUpdate();
    window.addEventListener("suf-lang", this._lh); window.addEventListener("suf-cart", this._lh); window.addEventListener("suf-auth", this._lh);
    this._rz = () => { const m = window.innerWidth <= 820; if (m !== this.state.mobile) this.setState({ mobile: m }); };
    window.addEventListener("resize", this._rz);
  }
  componentWillUnmount() {
    window.removeEventListener("suf-lang", this._lh); window.removeEventListener("suf-cart", this._lh); window.removeEventListener("suf-auth", this._lh);
    window.removeEventListener("resize", this._rz);
  }
  cartQty() { try { return JSON.parse(localStorage.getItem("suf_cart") || "[]").reduce((s, x) => s + (x.qty || 0), 0); } catch (e) { return 0; } }
  setLang(l) { try { localStorage.setItem("suf_lang", l); } catch (e) {} window.dispatchEvent(new CustomEvent("suf-lang", { detail: l })); this.forceUpdate(); }
  renderVals() {
    const L = this.lang(), R = L === "ru";
    const M = this.state.mobile;
    const active = this.props.active ?? "Bosh sahifa";
    const base = [
      { key: "shop", uz: "Haridni boshlash", ru: "Начать покупки", legacy: ["Do'kon"], href: "Catalog.dc.html" },
    ];
    return {
      cartCount: this.cartQty(),
      mobile: M,
      navPad: M ? "13px 16px" : "20px 30px",
      navCols: M ? "auto 1fr auto" : "1fr auto 1fr",
      navGap: M ? "12px" : "18px",
      deskCluster: M ? "none" : "flex",
      deskRight: M ? "none" : "flex",
      logoImg: M ? "36px" : "44px",
      logoFont: M ? "17px" : "24px",
      logoJustify: M ? "flex-start" : "center",
      mobRight: M ? "flex" : "none",
      openMenu: () => this.setState({ open: true }),
      closeMenu: () => this.setState({ open: false }),
      ovOp: this.state.open ? 1 : 0,
      ovPe: this.state.open ? "auto" : "none",
      panelX: this.state.open ? "0" : "-100%",
      catTitle: R ? "Категории" : "Kategoriyalar",
      discountLabel: R ? "Товары со скидкой" : "Chegirmadagi mahsulotlar",
      addressLabel: R ? "Адрес и часы работы" : "Manzil va ish vaqti",
      adminPanel: R ? "Админ-панель" : "Admin panel",
      isAdmin: (() => { try { return localStorage.getItem("suf_admin") === "1"; } catch (e) { return false; } })(),
      cats: [
        { slug: "liboslar", label: R ? "Платья" : "Liboslar" },
        { slug: "poyabzal", label: R ? "Обувь" : "Poyabzal" },
        { slug: "atirlar", label: R ? "Парфюмерия" : "Atirlar" },
        { slug: "choyshab", label: R ? "Комплекты постельного белья" : "Choyshab to'plamlari" },
        { slug: "ichki", label: R ? "Нижнее бельё" : "Ichki kiyim" },
      ].map((c) => ({ label: c.label, href: "Catalog.dc.html?cat=" + c.slug })),
      tgHref: "https://t.me/ShopuzFeruzaxon",
      igHref: "https://www.instagram.com/shopuzferuzaxon1",
      openTg: (e) => { try { e.preventDefault(); window.open("https://t.me/ShopuzFeruzaxon", "_blank", "noopener"); } catch (err) {} },
      openIg: (e) => { try { e.preventDefault(); window.open("https://www.instagram.com/shopuzferuzaxon1", "_blank", "noopener"); } catch (err) {} },
      newLabel: R ? "НОВОЕ" : "NEW",
      loginLabel: (() => { try { const u = JSON.parse(localStorage.getItem("suf_user") || "null"); if (u && u.name) return "👤 " + u.name; } catch (e) {} return R ? "Вход" : "Kirish"; })(),
      authHref: (() => { try { return JSON.parse(localStorage.getItem("suf_user") || "null") ? "Profil.dc.html" : "Login.dc.html"; } catch (e) { return "Login.dc.html"; } })(),
      uzW: R ? 400 : 600, uzC: R ? "var(--ink-soft)" : "var(--ink)",
      ruW: R ? 600 : 400, ruC: R ? "var(--ink)" : "var(--ink-soft)",
      setUz: () => this.setLang("uz"),
      setRu: () => this.setLang("ru"),
      links: base.map((b) => {
        const on = b.uz === active || b.key === active || (b.legacy || []).includes(active);
        return { label: R ? b.ru : b.uz, href: b.href, badge: !!b.badge, color: on ? "var(--ink)" : "var(--ink-2)", uw: on ? "100%" : "0" };
      }),
    };
  }
}
</script>
</body>
</html>
