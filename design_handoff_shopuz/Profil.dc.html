<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="chic.css">
</helmet>
<div style="background:var(--bg);min-width:0;min-height:100%">
  <dc-import name="StoreNav" active="" cart-count="0" hint-size="100%,84px"></dc-import>

  <div style="max-width:720px;margin:0 auto;padding:56px 30px;min-height:52vh">
    <div style="text-align:center;margin-bottom:36px">
      <h1 style="font-size:clamp(30px,4.4vw,44px)">{{ title }}</h1>
    </div>

    <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
      <div style="border:1px solid var(--line);padding:36px;display:flex;flex-direction:column;gap:22px;align-items:center">
        <span style="display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--tile);font-size:38px">👤</span>
        <div style="text-align:center">
          <div style="font-family:var(--serif);font-size:24px;margin-bottom:4px">{{ name }}</div>
          <div class="muted" style="font-size:14px">{{ phone }}</div>
        </div>
        <div style="width:100%;height:1px;background:var(--line)"></div>
        <div style="display:flex;flex-direction:column;gap:2px;width:100%">
          <a href="Cart.dc.html" style="display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);color:var(--ink)"><span>{{ ordersLabel }}</span><span class="muted">›</span></a>
          <a href="Catalog.dc.html" style="display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);color:var(--ink)"><span>{{ favLabel }}</span><span class="muted">›</span></a>
          <a href="Aloqa.dc.html" style="display:flex;align-items:center;justify-content:space-between;padding:15px 4px;color:var(--ink)"><span>{{ contactLabel }}</span><span class="muted">›</span></a>
        </div>
        <button onClick="{{ logout }}" class="btn btn-secondary btn-block" style="padding:14px;cursor:pointer;margin-top:6px">{{ logoutBtn }}</button>
      </div>
    </sc-if>

    <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 0">
        <p style="font-size:16px;color:var(--ink-2)">{{ notLoggedText }}</p>
        <a href="Login.dc.html" class="btn btn-primary" style="padding:14px 28px">{{ loginBtn }}</a>
      </div>
    </sc-if>
  </div>

  <dc-import name="StoreFooter" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  lang() { try { return localStorage.getItem("suf_lang") || "uz"; } catch (e) { return "uz"; } }
  user() { try { return JSON.parse(localStorage.getItem("suf_user") || "null"); } catch (e) { return null; } }
  componentDidMount() { this._lh = () => this.forceUpdate(); window.addEventListener("suf-lang", this._lh); }
  componentWillUnmount() { window.removeEventListener("suf-lang", this._lh); }
  logout() {
    try { localStorage.removeItem("suf_user"); } catch (e) {}
    window.dispatchEvent(new CustomEvent("suf-auth"));
    window.location.href = "Home.dc.html";
  }
  renderVals() {
    const R = this.lang() === "ru";
    const u = this.user();
    return {
      title: R ? "Профиль" : "Profil",
      loggedIn: !!u,
      loggedOut: !u,
      name: u ? u.name : "",
      phone: u ? u.phone : "",
      ordersLabel: R ? "Мои заказы" : "Buyurtmalarim",
      favLabel: R ? "Избранное" : "Sevimlilar",
      contactLabel: R ? "Связаться с нами" : "Biz bilan bog'lanish",
      logoutBtn: R ? "Выйти" : "Chiqish",
      notLoggedText: R ? "Вы ещё не вошли в систему." : "Siz hali tizimga kirmagansiz.",
      loginBtn: R ? "Войти" : "Kirish",
      logout: () => this.logout(),
    };
  }
}
</script>
</body>
</html>
