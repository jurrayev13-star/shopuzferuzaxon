<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Aloqa · Shop Uz Feruzaxon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="page">
  <h1 class="mt-16" id="t-title"></h1>
  <div class="mt-16" id="t-body"></div>
</main>
<script src="/js/app.js"></script>
<script>
(function () {
  const S = window.SUF;
  S.mountChrome({ active: "profile", title: S.t("contact"), back: true });
  const R = S.store.lang() === "ru";
  document.getElementById("t-title").textContent = R ? "Контакты" : "Aloqa";
  const rows = R
    ? [
        { title: "Адрес", body: "Ташкент, Чиланзар, 3-й дом (по Яндексу: «Shop uz Feruzaxon»)" },
        { title: "Часы работы", body: "Пн–Сб · 10:00–22:00" },
        { title: "Телефон", body: "+998 91 191 91 78", href: "tel:+998911919178" },
        { title: "Telegram", body: "@ShopuzFeruza", href: "https://t.me/ShopuzFeruza" },
        { title: "Instagram", body: "@shopuzferuzaxon1", href: "https://www.instagram.com/shopuzferuzaxon1" },
        { title: "Админ", body: "Феруза" },
      ]
    : [
        { title: "Manzil", body: "Toshkent, Chilonzor, 3-uy (Yandex'da: «Shop uz Feruzaxon»)" },
        { title: "Ish vaqti", body: "Dushanba–Shanba · 10:00–22:00" },
        { title: "Telefon", body: "+998 91 191 91 78", href: "tel:+998911919178" },
        { title: "Telegram", body: "@ShopuzFeruza", href: "https://t.me/ShopuzFeruza" },
        { title: "Instagram", body: "@shopuzferuzaxon1", href: "https://www.instagram.com/shopuzferuzaxon1" },
        { title: "Admin", body: "Feruza" },
      ];
  document.getElementById("t-body").innerHTML = rows.map(r => `
    <div style="padding:14px 0;border-bottom:1px solid var(--line)">
      <div class="kicker" style="color:var(--muted); font-size:11px">${r.title}</div>
      <div class="mt-8" style="font-size:15px">${r.href ? `<a href="${r.href}" style="color:var(--accent)">${r.body}</a>` : r.body}</div>
    </div>
  `).join("");
})();
</script>
</body>
</html>
