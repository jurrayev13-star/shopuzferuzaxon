<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Profil · Shop Uz Feruzaxon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="page" id="page-root"></main>
<script src="/js/app.js"></script>
<script>
(function () {
  const S = window.SUF;
  S.mountChrome({ active: "profile", title: S.t("profile") });
  const root = document.getElementById("page-root");
  const user = S.store.user();

  if (!user) {
    root.innerHTML = `
      <div class="empty" style="padding-top:60px">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
        <h3>${S.t("guest")}</h3>
        <p class="muted">${S.t("login_first")}</p>
        <div class="mt-16" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <a class="btn btn-primary" href="auth.html">${S.t("login")}</a>
        </div>
      </div>
      <div class="mt-24">
        <h3 class="section-title">${S.t("about")}</h3>
        <div style="display:flex;flex-direction:column;gap:2px">
          <a class="btn btn-secondary btn-block mt-8" href="info/about.html">${S.t("about")}</a>
          <a class="btn btn-secondary btn-block" href="info/delivery.html">${S.t("delivery_info")}</a>
          <a class="btn btn-secondary btn-block" href="info/contact.html">${S.t("contact")}</a>
          <a class="btn btn-secondary btn-block" href="info/sizes.html">${S.t("size_chart")}</a>
        </div>
        <div class="mt-24 flex items-center gap-8 justify-between">
          <span class="muted">${S.t("change_language")}</span>
          <div class="lang-switch" id="lang-switch">
            <button data-l="uz" class="${S.store.lang() === "uz" ? "active" : ""}">UZ</button>
            <button data-l="ru" class="${S.store.lang() === "ru" ? "active" : ""}">RU</button>
          </div>
        </div>
      </div>
    `;
    wireLang();
    return;
  }

  // Logged-in view
  const initials = (user.name || "?").split(" ").map(x => x[0]).join("").slice(0,2).toUpperCase();
  root.innerHTML = `
    <div class="flex items-center gap-16 mt-16" style="padding:14px 0;border-bottom:1px solid var(--line)">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:600">${initials}</div>
      <div>
        <div style="font-family:var(--serif);font-size:22px;font-weight:600">${user.name || "-"}</div>
        <div class="muted f-13">${user.phone || ""}</div>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">${S.t("my_orders")}</h2>
      <div id="orders"></div>
    </div>

    <div class="section">
      <div style="display:flex;flex-direction:column;gap:8px">
        <a class="btn btn-secondary btn-block" href="chegirma.html">${S.t("sale")}</a>
        <a class="btn btn-secondary btn-block" href="info/delivery.html">${S.t("delivery_info")}</a>
        <a class="btn btn-secondary btn-block" href="info/about.html">${S.t("about")}</a>
        <a class="btn btn-secondary btn-block" href="info/contact.html">${S.t("contact")}</a>
        <a class="btn btn-secondary btn-block" href="info/sizes.html">${S.t("size_chart")}</a>
        ${S.store.isAdmin() ? `<a class="btn btn-secondary btn-block" href="admin.html">${S.t("admin_panel")}</a>` : ""}
      </div>
    </div>

    <div class="mt-24 flex items-center gap-8 justify-between">
      <span class="muted">${S.t("change_language")}</span>
      <div class="lang-switch" id="lang-switch">
        <button data-l="uz" class="${S.store.lang() === "uz" ? "active" : ""}">UZ</button>
        <button data-l="ru" class="${S.store.lang() === "ru" ? "active" : ""}">RU</button>
      </div>
    </div>

    <div class="mt-24">
      <button class="btn btn-secondary btn-block" id="btn-logout">${S.t("logout")}</button>
    </div>
    <div class="spacer-lg"></div>
  `;

  wireLang();

  document.getElementById("btn-logout").onclick = () => {
    S.store.clearUser();
    location.href = "index.html";
  };

  const oEl = document.getElementById("orders");
  oEl.innerHTML = `<p class="muted f-13">${S.t("loading")}</p>`;
  S.API.myOrders(user.phone).then(({ ok, body }) => {
    if (!ok || !body || !Array.isArray(body.items) || body.items.length === 0) {
      oEl.innerHTML = `<p class="muted f-13">${S.t("empty_cart")}</p>`;
      return;
    }
    const statusLabels = {
      new: S.t("order_new"), processing: S.t("order_processing"),
      shipped: S.t("order_shipped"), done: S.t("order_done"), cancelled: S.t("order_cancelled"),
    };
    oEl.innerHTML = body.items.map(o => {
      const items = (o.items || []).slice(0, 3).map(it => `${it.title} × ${it.qty}`).join(", ");
      return `
        <div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px">
          <div>
            <div style="font-weight:500">#${o.id} · ${statusLabels[o.status] || o.status}</div>
            <div class="f-13 muted">${new Date(o.created_at).toLocaleDateString(S.store.lang() === "ru" ? "ru-RU" : "uz-UZ")}</div>
            <div class="f-13 mt-8">${items}</div>
          </div>
          <div style="font-family:var(--serif);font-weight:600">${S.fmtPrice(o.total)}</div>
        </div>
      `;
    }).join("");
  }).catch(() => { oEl.innerHTML = `<p class="muted f-13">${S.t("loading")}</p>`; });

  function wireLang() {
    document.getElementById("lang-switch")?.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-l]"); if (!b) return;
      S.store.setLang(b.getAttribute("data-l"));
      location.reload();
    });
  }
})();
</script>
</body>
</html>
