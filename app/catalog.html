<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Katalog · Shop Uz Feruzaxon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="page">
  <div class="chips" id="cat-chips"></div>
  <div id="cat-title" class="mt-8"></div>
  <div class="grid mt-16" id="prod-grid"></div>
  <div class="spacer-lg"></div>
</main>
<script src="/js/app.js"></script>
<script>
(function () {
  const S = window.SUF;
  const cat = new URLSearchParams(location.search).get("cat");

  S.mountChrome({ active: "catalog", title: S.t("catalog") });

  const CATS = [
    { slug: null, key: "all" },
    { slug: "liboslar", key: "liboslar" },
    { slug: "poyabzal", key: "poyabzal" },
    { slug: "atirlar", key: "atirlar" },
    { slug: "choyshab", key: "choyshab" },
    { slug: "ichki", key: "ichki" },
  ];

  const chips = document.getElementById("cat-chips");
  chips.innerHTML = CATS.map(c => {
    const active = (cat || null) === c.slug ? "active" : "";
    const href = c.slug ? `catalog.html?cat=${c.slug}` : "catalog.html";
    return `<a class="chip ${active}" href="${href}">${S.t(c.key)}</a>`;
  }).join("");

  const titleEl = document.getElementById("cat-title");
  const activeKey = (CATS.find(c => c.slug === cat) || CATS[0]).key;
  titleEl.innerHTML = `<h2 class="section-title" style="margin:8px 0 4px">${S.t(activeKey)}</h2>`;

  const grid = document.getElementById("prod-grid");
  grid.innerHTML = Array.from({ length: 6 }).map(() => S.skeletonCardHtml()).join("");
  const params = cat ? { cat } : {};
  S.API.products(params).then(({ ok, body }) => {
    if (!ok || !body || !Array.isArray(body.items) || body.items.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>${S.t("no_products")}</h3></div>`;
      return;
    }
    grid.innerHTML = body.items.map(S.productCardHtml).join("");
  }).catch(() => {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>${S.t("no_products")}</h3></div>`;
  });
})();
</script>
</body>
</html>
